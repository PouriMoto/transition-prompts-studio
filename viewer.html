<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Viewer</title>
<style>
  :root {
    --bg: #0b1220;
    --surface: #111827;
    --border: #1e2d45;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --primary: #22d3ee;
    --dim: #0891b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  h1 { font-size: 1rem; margin: 0; color: var(--primary); font-weight: 700; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--dim);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 650;
    cursor: pointer;
  }
  button.ghost { background: #1a2436; color: var(--text); border: 1px solid var(--border); }
  .note { color: var(--muted); font-size: 0.8rem; padding: 8px 16px; }
  .stage-wrap { height: calc(100vh - 108px); padding: 0 16px 16px; }
  iframe { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; background: #000; }
  .empty { padding: 40px 16px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>نمایش خروجی</h1>
  <div class="actions">
    <button id="replay" class="ghost" type="button">پخش دوباره</button>
    <button id="dlHtml" type="button">دانلود HTML</button>
    <button id="dlPrompt" class="ghost" type="button">دانلود پرامپت</button>
    <a href="index.html"><button class="ghost" type="button">بازگشت به ویزارد</button></a>
  </div>
</header>
<p class="note" id="note">اگر صدای زمینه انتخاب شده، همان فایل را کنار HTML دانلودشده بگذارید.</p>
<div class="stage-wrap" id="wrap"></div>
<script>
const raw = localStorage.getItem("tw_bundle");
const note = document.getElementById("note");
const wrap = document.getElementById("wrap");
if (!raw) {
  wrap.innerHTML = '<p class="empty">خروجی‌ای نیست. از ویزارد دکمه نمایش را بزنید.</p>';
} else {
  const bundle = JSON.parse(raw);
  const frame = document.createElement("iframe");
  frame.setAttribute("sandbox", "allow-scripts");
  frame.srcdoc = bundle.html || "<p style='color:#fff;font-family:sans-serif'>HTML خالی است.</p>";
  wrap.appendChild(frame);
  if (bundle.bgFile) {
    note.textContent = "فایل صدای زمینه «" + bundle.bgFile + "» را کنار فایل HTML بگذارید تا پخش شود.";
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  document.getElementById("dlHtml").onclick = () => download("index.html", bundle.html || "", "text/html");
  document.getElementById("dlPrompt").onclick = () => download("prompt.md", bundle.prompt || "", "text/markdown");
  document.getElementById("replay").onclick = () => { frame.srcdoc = bundle.html; };
}
</script>
</body>
</html>
